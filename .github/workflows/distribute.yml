name: Build & Distribute APK to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > androidApp/release.jks
            echo "ANKIDUEL_KEYSTORE_PATH=$GITHUB_WORKSPACE/androidApp/release.jks" >> $GITHUB_ENV
          fi

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :shared:test :androidApp:testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          ANKIDUEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANKIDUEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANKIDUEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:448151775685:android:7672c3dac117b37bf903ac
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: amis
          file: androidApp/build/outputs/apk/release/androidApp-release.apk
          releaseNotes: "Mise a jour automatique (${{ github.sha }})"
