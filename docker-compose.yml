services:
  ankiduel-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=jdbc:sqlite:/data/ankiduel.db
      - JWT_SECRET=change-this-production-secret
    volumes:
      - ankiduel_data:/data
    restart: unless-stopped

volumes:
  ankiduel_data:
